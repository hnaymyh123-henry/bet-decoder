<body>

<header class="top"><div class="top-in">
  <div class="brand"><span class="mk">P</span>PlayInsight</div>
  <div class="sp"></div>
  <span class="pill" id="offline-pill">Live</span>
  <button class="iconbtn" id="changes-btn" title="Changes"><span class="dot"></span>&#9673;</button>
</div></header>

<main class="app" id="view"></main>

<button class="fab" id="fab-decode">+</button>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="decode-sheet">
  <div class="hd">Decode a bet</div>
  <div class="sub">A ticker, or a comma-separated basket for a portfolio.</div>
  <input type="text" id="bet-input" placeholder="NVDA  or  NVDA,MSFT,GOOG">
  <div class="modehint" id="mode-hint">&nbsp;</div>
  <div class="presets">
    <button class="chip" data-input="COST">COST</button>
    <button class="chip" data-input="NVDA">NVDA</button>
    <button class="chip" data-input="TSLA">TSLA</button>
    <button class="chip" data-input="NVDA,MSFT,GOOG,AMZN,META">Sample portfolio</button>
  </div>
  <button class="btn primary" id="decode-go">Decode</button>
</div>

<aside class="drawer" id="changes-panel">
  <div class="hd"><span class="ttl">Changes</span><button class="scan" id="chg-scan">Scan</button><button class="cls" id="chg-close">&times;</button></div>
  <div class="list" id="chg-list"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   HELPERS
   ============================================================ */
function escapeHTML(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function cssAttr(s){return String(s).replace(/"/g,'\\"');}
function fmtUsd(v){return (typeof v==='number'&&isFinite(v))?'$'+v.toLocaleString('en-US',{maximumFractionDigits:Math.abs(v)>=100?0:2}):'—';}
function fmtPct(v,dp){return (typeof v==='number'&&isFinite(v))?(v*100).toFixed(dp==null?0:dp)+'%':'—';}
function fmtPct01(v,dp){return fmtPct(v,dp);}
function todayISO(){return new Date().toISOString().slice(0,10);}
let _toastTimer=null;
function showToast(html,ms=3800){
  const el=document.getElementById('toast'); if(!el)return;
  el.innerHTML=html; el.classList.add('show');
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}
function initials(sym){return String(sym||'?').slice(0,1).toUpperCase();}

/* ============================================================
   API LAYER — thin fetch wrappers, every call is honest about failure
   ============================================================ */
const api = {
  async get(path){ const r=await fetch(path); const j=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,body:j}; },
  async post(path,body){ const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); const j=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,body:j}; },
  del(path){ return fetch(path,{method:'DELETE'}).then(r=>r.json().catch(()=>({}))); },
  cards(){ return this.get('/api/cards'); },
  card(id){ return this.get('/api/cards/'+encodeURIComponent(id)); },
  decode(sourceType,sourceInput,jobId){ return this.post('/api/decode',{source_type:sourceType,source_input:sourceInput,job_id:jobId}); },
  ask(id,question,jobId){ return this.post('/api/cards/'+encodeURIComponent(id)+'/ask',{question,job_id:jobId}); },
  revise(id,revision){ return this.post('/api/cards/'+encodeURIComponent(id)+'/revise',revision||{}); },
  plan(id,body){ return this.post('/api/cards/'+encodeURIComponent(id)+'/plan',body||{}); },
  chart(subject,cardId,window_){ return this.get('/api/chart/'+encodeURIComponent(subject)+'?window='+(window_||'180d')+(cardId?'&card_id='+encodeURIComponent(cardId):'')); },
  positions(status){ return this.get('/api/positions'+(status?('?status='+status):'')); },
  positionEvent(body){ return this.post('/api/positions/events',body); },
  synthesize(cardIds){ return this.post('/api/synthesize',{card_ids:cardIds}); },
  monitorFeed(){ return this.get('/api/monitor/feed?limit=100'); },
  monitorScan(subjects){ return this.post('/api/monitor/scan',{trigger:'manual',subjects:subjects||[]}); },
  offlineMode(){ return this.get('/api/offline-mode'); },
};

/* ============================================================
   STATE
   ============================================================ */
const state = {
  cards: [],              // list-shape cards (with _display), from GET /api/cards
  detail: {},             // card_id -> full card (with decode_detail), lazily fetched
  view: 'home',           // 'home' | 'card' | 'portfolio'
  activeId: null,
  homeTab: 'positions',   // 'positions' | 'watchlist'
  offline: false,
  openBlk: {},            // card_id -> currently-open accordion block key (one at a time)
  chat: {},               // card_id -> [{role,text}]
  revision: {},           // card_id -> pending unsaved revision proposal
  chart: {},              // subject -> chart payload | 'loading' | 'error'
  positionCtx: {},        // card_id -> position_context (from /plan)
  positions: null,        // cached GET /api/positions .positions[]
  synth: {},              // sorted holdings-id key -> SynthesisResult | 'loading' | 'error'
  monitorFeed: null,
  activeAsk: {},          // card_id -> {text, placeholder} last chart-click context
  debateTab: {},          // card_id -> 'bull' | 'bear' | 'axis' | 'catalyst'
};
let _activityStream = null;

/* ============================================================
   ROUTER
   ============================================================ */
function nav(view, id){
  state.view = view; state.activeId = id || null;
  const hash = view==='home' ? '#/' : (view==='portfolio' ? '#/portfolio/'+id : '#/card/'+id);
  if (location.hash !== hash) history.pushState(null,'',hash);
  render();
  window.scrollTo(0,0);
}
function routeFromHash(){
  const h = location.hash || '#/';
  let m;
  if ((m = h.match(/^#\/card\/(.+)$/))) { state.view='card'; state.activeId=m[1]; }
  else if ((m = h.match(/^#\/portfolio\/(.+)$/))) { state.view='portfolio'; state.activeId=m[1]; }
  else { state.view='home'; state.activeId=null; }
  render();
}
window.addEventListener('popstate', routeFromHash);
window.addEventListener('hashchange', routeFromHash);

function render(){
  const root = document.getElementById('view');
  if (!root) return;
  if (state.view==='card') root.innerHTML = renderCardDetail(state.activeId);
  else if (state.view==='portfolio') root.innerHTML = renderPortfolioDetail(state.activeId);
  else root.innerHTML = renderHome();
  bindViewEvents();
  afterRenderSideEffects();
}

/* ============================================================
   HOME — position terminal: folio summary + segmented + health-sorted list
   ============================================================ */
function renderHome(){
  const all = state.cards.filter(c => !c.derived_from);
  if (!all.length){
    return '<div class="empty"><div class="big-ico">&#9673;</div><strong>No bets decoded yet.</strong><br>Paste a ticker or a comma-separated basket to X-ray what it implicitly believes.<br><button class="btn primary" id="empty-decode" style="width:auto;margin-top:16px">Decode your first bet</button></div>';
  }
  const openSubjects = new Set((state.positions||[]).map(p => String(p.subject||'').toUpperCase()));
  const positions = all.filter(c => openSubjects.has(String(c.subject||'').toUpperCase()) || c.card_kind==='portfolio');
  const watchlist = all.filter(c => !openSubjects.has(String(c.subject||'').toUpperCase()) && c.card_kind!=='portfolio');
  const active = state.homeTab==='positions' ? positions : watchlist;

  const healthRank = {red:0,yellow:1,green:2,gray:3};
  const sorted = [...active].sort((a,b) => healthRank[healthOf(a)] - healthRank[healthOf(b)]);

  const redN = active.filter(c=>healthOf(c)==='red').length;
  const yellowN = active.filter(c=>healthOf(c)==='yellow').length;
  const folio = '<div class="folio">' +
    '<div class="lbl">Decoded &middot; ' + all.length + (all.length===1?' bet':' bets') + '</div>' +
    '<div class="kicker">' + (redN ? ('<b>'+redN+' flagged</b> — check KILL lines &amp; contradictions first.') :
      (yellowN ? (yellowN+' showing divergence — worth a look.') : 'Everything reconciles cleanly right now.')) + '</div>' +
  '</div>';

  const seg = '<div class="seg">' +
    '<div class="s' + (state.homeTab==='positions'?' on':'') + '" data-hometab="positions">Positions &middot; ' + positions.length + '</div>' +
    '<div class="s' + (state.homeTab==='watchlist'?' on':'') + '" data-hometab="watchlist">Watchlist &middot; ' + watchlist.length + '</div>' +
  '</div>';

  const rows = sorted.map(renderHomeRow).join('') ||
    '<div class="empty" style="padding:36px 16px">' + (state.homeTab==='positions' ?
      'No confirmed positions yet — decode a ticker and confirm a position from its Trade Plan.' :
      'Nothing on the watchlist.') + '</div>';

  return folio + seg + '<div id="home-list">' + rows + '</div>';
}

function renderHomeRow(c){
  const h = healthOf(c);
  const isPf = c.card_kind === 'portfolio';
  const px = c._display && c._display.anchor;
  const chg = ''; // no intraday feed in this app; omit rather than fabricate
  const sub = isPf ? ((c.holdings||[]).length + ' holdings') : (c.source_type==='market' ? 'Market bet' : (c.source_type||''));
  return '<div class="prow" data-gorow="' + escapeHTML(c.card_id) + '|' + (isPf?'portfolio':'card') + '">' +
    '<span class="hdot ' + h + '"></span>' +
    '<div class="plogo">' + escapeHTML(initials(c.subject)) + '</div>' +
    '<div class="pmid"><div class="t1">' + escapeHTML(c.subject) + (isPf?'<span class="tag">Portfolio</span>':'') + '</div>' +
      '<div class="t2">' + escapeHTML(oneLiner(c)) + '</div></div>' +
    '<div class="pright"><div class="px num">' + (px!=null ? fmtUsd(px) : '&mdash;') + '</div>' +
      (sub ? '<div class="chg flat">'+escapeHTML(sub)+'</div>' : '') + '</div>' +
    '<div class="pcaret">&rsaquo;</div>' +
  '</div>';
}

function healthOf(card){
  const dd = (state.detail[card.card_id]||{}).decode_detail || card.decode_detail || {};
  const ci = (dd.reconciliation||{}).conviction_input || {};
  const kill = (dd.decision||{}).kill || {};
  if ((ci.contradiction_count||0) > 0 || kill.status === 'triggered') return 'red';
  if ((ci.divergent_count||0) > 0 || kill.status === 'approached') return 'yellow';
  if (ci.total_checks) return 'green';
  return 'gray';
}
function oneLiner(card){
  const d = card._display || {};
  const x = d.xray || {};
  if (card.card_kind === 'portfolio'){
    const themes = [...(card.theme_exposures||[])].sort((a,b)=>(Number(b.exposure_pct)||0)-(Number(a.exposure_pct)||0));
    const top = themes[0];
    if (top) return Math.round(top.exposure_pct||0) + '% in ' + top.theme + (top.is_concentration_risk?' (concentrated)':'');
    const n = (card.holdings||[]).length;
    return n ? (n + ' holdings — not yet theme-aggregated') : 'empty portfolio';
  }
  if (x.headline_zh) return x.headline_zh;
  if (x.verdict_zh) return x.verdict_zh;
  if (typeof d.implied_cagr === 'number') return 'market wants ' + fmtPct(d.implied_cagr) + ' CAGR';
  if (d.bet_statement) return d.bet_statement;
  const dec = (card.decode_detail||{}).decision;
  if (dec && dec.stance) return STANCE_LABEL[dec.stance] || dec.stance;
  if ((card.decode_detail||{}).status === 'insufficient') return (card.decode_detail||{}).reason || 'insufficient data to decode';
  return 'decoded — tap for detail';
}

/* ============================================================
   CHART-AS-SUBJECT (SPEC_E core) — the chart is the primary object; every
   click rewrites ONE AI strip below it, never spawns a new section.
   Two honest modes:
   - snapshot: no panel_observations history yet -> a single-frame diagram of
     TODAY's real numbers (price / DCF baseline / distribution band / KILL).
     Never drawn as a time series (SPEC E-13 forbids masquerading a point as
     history).
   - history: /api/chart returns populated layers -> the real drift chart
     (candles + distribution band + implied-growth sub-chart + consensus
     dashed + event anchors + KILL dashed), exactly per SPEC_E defaults.
   ============================================================ */
function _chartModel(card){
  const dd = card.decode_detail || {};
  const d = card._display || {};
  const panel = Array.isArray(dd.panel) ? dd.panel : [];
  const cash = panel.find(p => p.channel==='cashflow') || {};
  const dist = panel.find(p => p.channel==='distribution') || {};
  const cm = cash.metrics || {};
  const dm = dist.metrics || {};
  const price = d.anchor;
  const baseline = d.baseline_dcf;
  const band = dm.distribution_band || (cm.primary && cm.primary.r2_band) || dd.r2_band || null;
  const kill = (dd.decision||{}).kill || null;
  const wwhKill = (d.xray && d.xray.wwhtbt || []).find(w => w.kind==='kill') || null;
  return { price, baseline, band, kill, wwhKill, implied_cagr: d.implied_cagr, cm, dm };
}

function _ecSetAI(cardId, html, src, ask){
  const root = document.querySelector('[data-chartroot="'+cssAttr(cardId)+'"]');
  if (!root) return;
  const txt = root.querySelector('.ai-strip .txt'); const s = root.querySelector('.ai-strip .src');
  if (txt) txt.innerHTML = html; if (s) s.textContent = '— ' + src;
  const inp = root.querySelector('.askbar input');
  if (inp && ask) inp.placeholder = ask;
  state.activeAsk[cardId] = ask;
}

function _ecDefaultAI(card){
  const m = _chartModel(card);
  const d = card._display || {};
  if (d.xray && d.xray.headline_zh) return { html: escapeHTML(d.xray.headline_zh), src: 'overview', ask: 'Ask anything about ' + card.subject };
  if (typeof m.implied_cagr === 'number'){
    const killTxt = m.kill && m.kill.line ? (' KILL sits at <b>'+escapeHTML(String(m.kill.line))+'</b>.') : '';
    return { html: 'The market needs <b>' + fmtPct(m.implied_cagr) + '</b> growth to justify this price.' + killTxt, src: 'overview', ask: 'Ask anything about ' + card.subject };
  }
  return { html: 'Not enough data to summarize this bet yet.', src: 'overview', ask: 'Ask anything about ' + card.subject };
}

function renderChart(card){
  const m = _chartModel(card);
  const cid = card.card_id;
  const legend = '<div class="legend">' +
    '<div class="li"><span class="sw dist"></span>market range</div>' +
    '<div class="li"><span class="sw imp"></span>implied growth</div>' +
    '<div class="li"><span class="sw cons"></span>consensus</div>' +
    '<div class="li"><span class="sw evt"></span>event</div>' +
    '<div class="li"><span class="sw kill"></span>KILL</div>' +
  '</div>';
  const def = _ecDefaultAI(card);
  return '<div class="chartcard" data-chartroot="' + escapeHTML(cid) + '">' +
    '<div class="chd"><span>' + escapeHTML(card.subject) + ' &middot; click any element</span><span id="chart-mode-' + escapeHTML(cid) + '">snapshot</span></div>' +
    legend +
    '<div data-chartsvg="' + escapeHTML(cid) + '"><svg id="svg-' + escapeHTML(cid) + '" viewBox="0 0 480 260" preserveAspectRatio="xMidYMid meet" style="width:100%;height:220px"></svg></div>' +
    '<div class="snap-note" data-snapnote="' + escapeHTML(cid) + '"></div>' +
    '<div class="ai-strip"><div class="ico">AI</div><div class="body"><div class="txt">' + def.html + '</div><span class="src">— ' + def.src + '</span></div></div>' +
    '<div class="askbar"><input type="text" data-askinput="' + escapeHTML(cid) + '" placeholder="' + escapeHTML(def.ask) + '"><button class="send" data-asksend="' + escapeHTML(cid) + '">&uarr;</button></div>' +
  '</div>';
}

/* draws into the already-mounted <svg id="svg-<id>">; called after innerHTML mount */
async function paintChart(card){
  const cid = card.card_id;
  const svg = document.getElementById('svg-'+cid);
  if (!svg) return;
  let chart = state.chart[card.subject];
  if (chart === undefined){
    state.chart[card.subject] = 'loading';
    try {
      const r = await api.chart(card.subject, cid, '180d');
      chart = r.ok ? r.body : 'error';
    } catch(_) { chart = 'error'; }
    state.chart[card.subject] = chart;
  }
  const hasHistory = chart && chart.layers && Array.isArray(chart.layers.price) && chart.layers.price.length >= 3;
  const modeEl = document.getElementById('chart-mode-'+cid);
  if (modeEl) modeEl.textContent = hasHistory ? 'history' : 'snapshot';
  if (hasHistory) paintHistoryChart(svg, card, chart);
  else paintSnapshotChart(svg, card);
  bindChartEvents(card);
}

/* ---- snapshot: one honest frame of today's real numbers ---- */
function paintSnapshotChart(svg, card){
  const m = _chartModel(card);
  const note = document.querySelector('[data-snapnote="'+cssAttr(card.card_id)+'"]');
  if (note) note.textContent = 'Snapshot of today’s numbers — becomes a drift chart once history accumulates.';
  const vals = [m.price, m.baseline, m.band&&m.band.lower, m.band&&m.band.upper, m.kill&&m.kill.level].filter(v=>typeof v==='number'&&isFinite(v));
  if (!vals.length){
    svg.innerHTML = '<text x="240" y="130" font-size="12" fill="#5B6673" text-anchor="middle" font-family="Inter">no numbers to plot yet — insufficient data</text>';
    return;
  }
  const lo = Math.min(...vals)*0.92, hi = Math.max(...vals)*1.08;
  const X0=24,X1=456,Y0=30,Y1=190;
  const px = v => Y1-(v-lo)/(hi-lo||1)*(Y1-Y0);
  let s = '';
  [0,0.25,0.5,0.75,1].forEach(t=>{
    const v = lo+(hi-lo)*t, y = px(v);
    s += `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="#252C35" stroke-width="0.5" stroke-dasharray="2,3"/>`;
    s += `<text x="${X1+4}" y="${y+3}" font-size="8" fill="#5B6673" font-family="Inter">$${v.toFixed(0)}</text>`;
  });
  if (m.band && typeof m.band.lower==='number' && typeof m.band.upper==='number'){
    s += `<rect class="hit" data-el="band" x="${X0}" y="${px(m.band.upper)}" width="${X1-X0}" height="${px(m.band.lower)-px(m.band.upper)}" fill="#5DCAA5" opacity="0.16"/>`;
    s += `<text x="${X0+4}" y="${px(m.band.upper)-4}" font-size="9" fill="#5DCAA5" font-family="Inter">market range ${fmtUsd(m.band.lower)}–${fmtUsd(m.band.upper)}</text>`;
  }
  if (typeof m.baseline==='number'){
    const y = px(m.baseline);
    s += `<rect class="hit" data-el="baseline" x="${X0}" y="${y-8}" width="${X1-X0}" height="16" fill="transparent"/>`;
    s += `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="#8A94A3" stroke-width="1.5" stroke-dasharray="4,3" pointer-events="none"/>`;
    s += `<text x="${X0+4}" y="${y-5}" font-size="9" fill="#8A94A3" font-family="Inter" pointer-events="none">DCF fair value ${fmtUsd(m.baseline)}</text>`;
  }
  const killLevel = (m.kill && typeof m.kill.level==='number') ? m.kill.level : null;
  if (killLevel!=null){
    const y = px(killLevel);
    s += `<rect class="hit" data-el="kill" x="${X0}" y="${y-8}" width="${X1-X0}" height="16" fill="transparent"/>`;
    s += `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="#F6465D" stroke-width="1.5" stroke-dasharray="6,3" pointer-events="none"/>`;
    s += `<text x="${X0+4}" y="${y+12}" font-size="9" font-weight="700" fill="#F6465D" font-family="Inter">KILL ${fmtUsd(killLevel)}</text>`;
  }
  if (typeof m.price==='number'){
    const y = px(m.price), x=(X0+X1)/2;
    s += `<circle class="hit" data-el="price" cx="${x}" cy="${y}" r="6" fill="#EAECEF"/>`;
    s += `<text x="${x+10}" y="${y+3}" font-size="10" font-weight="700" fill="#EAECEF" font-family="Inter">${fmtUsd(m.price)} today</text>`;
  }
  svg.innerHTML = s;
}

/* ---- history: real multi-layer drift chart from /api/chart observations ---- */
function paintHistoryChart(svg, card, chart){
  const L = chart.layers||{};
  const price = L.price||[];
  const note = document.querySelector('[data-snapnote="'+cssAttr(card.card_id)+'"]');
  if (note) note.textContent = '';
  const closes = price.map(p=>p.close).filter(v=>typeof v==='number');
  if (!closes.length){ paintSnapshotChart(svg, card); return; }
  const lo = Math.min(...closes)*0.96, hi = Math.max(...closes)*1.04;
  const N = price.length;
  const X0=24,X1=456,Y0=15,Y1=155, SY0=170,SY1=210;
  const cx = i => X0+(N<=1?0:(i/(N-1))*(X1-X0));
  const cy = v => Y1-(v-lo)/(hi-lo||1)*(Y1-Y0);
  let s='';
  [0,0.5,1].forEach(t=>{ const v=lo+(hi-lo)*t, y=cy(v); s+=`<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="#252C35" stroke-width="0.5" stroke-dasharray="2,3"/><text x="${X1+4}" y="${y+3}" font-size="8" fill="#5B6673" font-family="Inter">$${v.toFixed(0)}</text>`; });
  const band = L.distribution_band||[];
  if (band.length){
    const up = band.map((b,i)=>`${cx(i)},${cy(b.upper)}`).join(' L ');
    const lop = band.slice().reverse().map((b,i)=>`${cx(band.length-1-i)},${cy(b.lower)}`).join(' L ');
    s += `<path class="hit" data-el="band" d="M ${up} L ${lop} Z" fill="#5DCAA5" opacity="0.14"/>`;
  }
  const cons = L.consensus||[];
  if (cons.length){
    const pts = cons.map((c,i)=>`${cx(i)},${cy(c.value)}`).join(' L ');
    s += `<path class="hit" data-el="consensus" d="M ${pts}" fill="none" stroke="transparent" stroke-width="14"/>`;
    s += `<path d="M ${pts}" fill="none" stroke="#8A94A3" stroke-width="1.4" stroke-dasharray="4,3" pointer-events="none"/>`;
  }
  price.forEach((p,i)=>{
    if (typeof p.close!=='number') return;
    const x=cx(i), y=cy(p.close);
    s += `<circle class="hit" data-el="price" data-idx="${i}" cx="${x}" cy="${y}" r="7" fill="transparent"/>`;
  });
  const closePath = price.map((p,i)=>`${cx(i)},${cy(p.close)}`).join(' L ');
  s += `<path d="M ${closePath}" fill="none" stroke="#EAECEF" stroke-width="1.6" pointer-events="none"/>`;
  const events = L.events||[];
  events.forEach(ev=>{
    const i = price.findIndex(p=>p.date===ev.date); if (i<0) return;
    const x = cx(i);
    s += `<rect class="hit" data-el="event" data-idx="${i}" x="${x-6}" y="${Y0}" width="12" height="${Y1-Y0}" fill="transparent"/>`;
    s += `<line x1="${x}" y1="${Y0}" x2="${x}" y2="${Y1}" stroke="#F0B90B" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" pointer-events="none"/>`;
  });
  const kills = L.kill_lines||[];
  if (kills.length && typeof kills[0].level === 'number'){
    const y = cy(kills[0].level);
    s += `<rect class="hit" data-el="kill" x="${X0}" y="${y-8}" width="${X1-X0}" height="16" fill="transparent"/>`;
    s += `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}" stroke="#F6465D" stroke-width="1.5" stroke-dasharray="6,3" pointer-events="none"/>`;
    s += `<text x="${X0+4}" y="${y-5}" font-size="9" font-weight="700" fill="#F6465D" font-family="Inter" pointer-events="none">KILL</text>`;
  }
  const growth = L.implied_growth||[];
  if (growth.length){
    const gvals = growth.map(g=>g.value).filter(v=>typeof v==='number');
    const glo = Math.min(...gvals,0), ghi = Math.max(...gvals,0.01);
    const gy = v => SY1-(v-glo)/((ghi-glo)||1)*(SY1-SY0);
    s += `<line x1="${X0}" y1="${SY0}" x2="${X1}" y2="${SY0}" stroke="#252C35" stroke-width="0.5"/>`;
    s += `<text x="${X0}" y="${SY0-3}" font-size="8" fill="#7B61FF" font-family="Inter" font-weight="600">implied growth %</text>`;
    const gpts = growth.map((g,i)=>{ const pi=price.findIndex(p=>p.date===g.date); return `${cx(pi<0?i:pi)},${gy(g.value)}`; }).join(' L ');
    s += `<path class="hit" data-el="implied" d="M ${gpts}" fill="none" stroke="transparent" stroke-width="14"/>`;
    s += `<path d="M ${gpts}" fill="none" stroke="#7B61FF" stroke-width="2" pointer-events="none"/>`;
  }
  svg.setAttribute('viewBox','0 0 480 '+(growth.length?220:170));
  svg.innerHTML = s;
}

function bindChartEvents(card){
  const svg = document.getElementById('svg-'+card.card_id);
  if (!svg || svg._bound) return; svg._bound = true;
  svg.addEventListener('click', (e)=>{
    const el = e.target;
    if (!el.classList || !el.classList.contains('hit')) return;
    svg.querySelectorAll('.active-el').forEach(x=>x.classList.remove('active-el'));
    // the hit target is often an invisible fat overlay (for thin lines with a
    // real click area); highlight its visible drawing sibling when present.
    const sib = el.nextElementSibling;
    (sib && sib.getAttribute('data-el')==null ? sib : el).classList.add('active-el');
    const key = el.dataset.el;
    const m = _chartModel(card);
    const MAP = {
      band: { html: m.band ? ('The market prices a range of <b>'+fmtUsd(m.band.lower)+'–'+fmtUsd(m.band.upper)+'</b>.'+(m.band.confidence?(' ('+Math.round(m.band.confidence*100)+'% confidence)'):'')) : 'No options-implied range available.', src:'distribution channel', ask:'Why is the range this wide?' },
      baseline: { html: typeof m.baseline==='number' ? ('If you only look at fundamentals (DCF), fair value is about <b>'+fmtUsd(m.baseline)+'</b>. Price is '+ (m.price!=null?fmtPct((m.price-m.baseline)/m.baseline):'&mdash;') +' from it.') : 'No DCF baseline available.', src:'cashflow channel', ask:'Why is price so far from fair value?' },
      kill: { html: m.kill&&m.kill.line ? ('This is your admission-of-error line — <b>'+escapeHTML(String(m.kill.line))+'</b>.') : (m.wwhKill ? ('Fundamental KILL: <b>'+escapeHTML(String(m.wwhKill.label))+' '+escapeHTML(String(m.wwhKill.value))+'</b>.') : 'No KILL line generated yet — needs a Trade Plan.'), src:'decision layer', ask:'What happens if this KILL line breaks?' },
      price: { html: typeof m.price==='number' ? ('Today’s price is <b>'+fmtUsd(m.price)+'</b>.'+(typeof m.implied_cagr==='number'?(' Implied growth ask: <b>'+fmtPct(m.implied_cagr)+'</b>.'):'')) : 'No price yet.', src:'price', ask:'What does this price imply?' },
      consensus: { html: 'This dashed line is what analyst consensus expects.', src:'revision channel', ask:'How far ahead of consensus is the market?' },
      event: { html: 'A recorded event on this date shifted the picture.', src:'event anchor', ask:'What happened on this date?' },
      implied: { html: typeof m.implied_cagr==='number' ? ('The market’s growth requirement — currently <b>'+fmtPct(m.implied_cagr)+'</b>.') : 'Implied growth series.', src:'cashflow channel', ask:'Why did this move?' },
    };
    const d = MAP[key] || MAP.price;
    _ecSetAI(card.card_id, d.html, d.src, d.ask);
  });
}

function bindAskBar(card){
  const root = document.querySelector('[data-chartroot="'+cssAttr(card.card_id)+'"]');
  if (!root) return;
  const input = root.querySelector('[data-askinput="'+cssAttr(card.card_id)+'"]');
  const send = root.querySelector('[data-asksend="'+cssAttr(card.card_id)+'"]');
  const fire = ()=>{ const q=(input.value||'').trim(); if(!q) return; input.value=''; askCard(card.card_id, q); };
  if (send) send.addEventListener('click', fire);
  if (input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') fire(); });
}

/* ============================================================
   CARD DETAIL — hero (always visible) + chart (the subject) +
   accordion blocks (collapsed by default; one open at a time; SPEC S1:
   lead channel first — distribution leads when it has a real signal).
   ============================================================ */
function _lookupCard(id){
  const base = state.cards.find(c => c.card_id === id);
  const full = state.detail[id];
  return full ? Object.assign({}, base, full) : base;
}

function renderCardDetail(id){
  const card = _lookupCard(id);
  if (!card) return '<div class="empty">Card not found.<br><button class="btn ghost" style="width:auto;margin-top:12px" data-gohome>&larr; Home</button></div>';
  const loaded = !!state.detail[id];
  const d = card._display || {};
  const dd = card.decode_detail || {};
  const px = d.anchor;

  const header = '<div class="dtop"><button class="back" data-gohome>&lsaquo;</button>' +
    '<div class="dtitle"><div class="t">' + escapeHTML(card.subject) + '</div>' +
    '<div class="sub">' + escapeHTML(card.source_type==='market'?'Market bet':(card.source_type||'')) + '</div></div>' +
    '<div class="dpx"><div class="p num">' + (px!=null?fmtUsd(px):'&mdash;') + '</div></div></div>';

  if (!loaded){
    return header + '<div class="vcard"><div class="say">Loading full decode…</div></div>';
  }

  const verdict = (d.xray&&d.xray.headline_zh) || (d.xray&&d.xray.verdict_zh) || d.bet_statement || 'Decoding complete — see below for detail.';
  const hero = '<div class="vcard"><div class="kicker">The bet, in one line</div>' +
    '<div class="headline">' + escapeHTML(verdict) + '</div></div>';

  const chart = renderChart(card);
  const derivedRail = renderDerivedRail(card);

  const blocks = [
    renderOddsBlock(card),
    renderAltitudeBlock(card),
    renderDebateBlock(card),
    renderTradePlanBlock(card),
    renderDerivationBlock(card),
    renderDiscussBlock(card),
  ].join('');

  return header + hero + chart + derivedRail + blocks;
}

function renderDerivedRail(card){
  const kids = state.cards.filter(c => c.derived_from === card.card_id);
  if (!kids.length) return '';
  return '<div class="vcard"><div class="kicker">Variants of this bet</div><div class="say">' +
    kids.map(k => '<span class="chip" data-gorow="'+escapeHTML(k.card_id)+'|card" style="margin:3px 4px 0 0;display:inline-block">'+escapeHTML(k.derivation_kind||'variant')+'</span>').join('') +
  '</div></div>';
}

function _blk(cardId, key, ico, title, sub, badgeHtml, bodyHtml, openByDefault){
  const isOpen = state.openBlk[cardId] ? state.openBlk[cardId]===key : !!openByDefault;
  return '<div class="blk' + (isOpen?' open':'') + '" data-blk="' + escapeHTML(cardId) + '|' + key + '">' +
    '<div class="blk-head" data-blktoggle="' + escapeHTML(cardId) + '|' + key + '">' +
      '<div class="ico">' + ico + '</div>' +
      '<div class="tt"><div class="t">' + escapeHTML(title) + '</div><div class="s">' + escapeHTML(sub||'') + '</div></div>' +
      (badgeHtml||'') +
      '<div class="car">&rsaquo;</div>' +
    '</div>' +
    '<div class="blk-body"><div class="blk-body-in">' + bodyHtml + '</div></div>' +
  '</div>';
}

/* ---- odds / distribution channel ---- */
function renderOddsBlock(card){
  const dd = card.decode_detail || {};
  const panel = Array.isArray(dd.panel) ? dd.panel : [];
  const dist = panel.find(p => p.channel==='distribution');
  const dm = (dist||{}).metrics || {};
  const range = dm.implied_range || dm.distribution_band;
  const prob = dm.prob_of_target;
  const hasSignal = dist && dist.status === 'ok';
  let body;
  if (!hasSignal){
    body = '<div class="say">No options-implied distribution for this subject yet — ' + escapeHTML((dist&&dist.headline) || 'honest-empty (no liquid chain / not computed).') + '</div>';
  } else {
    const conf = range && range.confidence ? Math.round(range.confidence*100) : 68;
    body = '<div class="odds"><div class="big">' + conf + '%</div><div class="r">' +
      '<div class="rg num">' + (range?fmtUsd(range.lower)+' – '+fmtUsd(range.upper):'&mdash;') + '</div>' +
      '<div class="tl">confidence range' + (range&&range.days_to_expiry?(' &middot; '+range.days_to_expiry+'d out'):'') + '</div></div></div>' +
      (prob && prob.target!=null ? '<div class="say" style="margin-top:8px">Probability above <b>'+fmtUsd(prob.target)+'</b>: <b>'+fmtPct(prob.prob_above)+'</b>.</div>' : '') +
      (dm.skew && dm.skew.percentile_1y!=null ? '<div class="say">Skew sits at the <b>'+Math.round(dm.skew.percentile_1y*100)+'th percentile</b> of its own 1y history.</div>' : '');
  }
  const badge = hasSignal ? '<span class="blk-badge ok">'+escapeHTML(dist.signal||'ok')+'</span>' : '<span class="blk-badge warn">empty</span>';
  return _blk(card.card_id, 'odds', '&#928;', 'Market’s odds', 'Options-implied range & probability', badge, body, hasSignal);
}

/* ---- altitude decomposition ---- */
function renderAltitudeBlock(card){
  const d = card._display || {};
  const dd = card.decode_detail || {};
  const panel = Array.isArray(dd.panel) ? dd.panel : [];
  const alt = panel.find(p => p.channel==='altitude');
  const decomp = (alt&&alt.metrics&&alt.metrics.decomposition) || null;
  let body, badge = '';
  if (decomp && (decomp.macro_pct!=null || decomp.company_pct!=null)){
    const mp=Math.round((decomp.macro_pct||0)*100), tp=Math.round((decomp.industry_pct||0)*100), cp=Math.round((decomp.company_pct||0)*100);
    body = '<div class="say">Only <b>'+cp+'%</b> of this move is the company itself.</div>' +
      '<div class="alt"><span style="width:'+mp+'%;background:var(--tx2)"></span><span style="width:'+tp+'%;background:var(--teal)"></span><span style="width:'+cp+'%;background:var(--ai)"></span></div>' +
      '<div class="altleg"><div class="l"><i style="background:var(--tx2)"></i>Macro '+mp+'%</div><div class="l"><i style="background:var(--teal)"></i>Theme '+tp+'%</div><div class="l"><i style="background:var(--ai)"></i>Company '+cp+'%</div></div>';
    if (cp < 30) badge = '<span class="blk-badge warn">mostly beta</span>';
  } else if (d.decomp && Array.isArray(d.decomp.parts) && d.decomp.parts.length){
    const rows = d.decomp.parts.map(p => '<div class="der-row"><span class="k">'+escapeHTML(p.label||p.theme||'component')+'</span><span class="v">'+fmtUsd(p.amt)+'</span></div>').join('');
    body = '<div class="say">Base business value ' + fmtUsd(d.decomp.base) + ' vs anchor ' + fmtUsd(d.decomp.anchor) + '. The gap is narrative:</div>' + rows;
    badge = '<span class="blk-badge warn">narrative-heavy</span>';
  } else {
    body = '<div class="say">Altitude decomposition not available for this subject (data_missing) — not treated as diversified.</div>';
  }
  return _blk(card.card_id, 'altitude', '&#9673;', 'What are you really betting on', 'Macro / theme / company split', badge, body, false);
}

/* ---- bull/bear debate ---- */
function renderDebateBlock(card){
  const dd = card.decode_detail || {};
  const full = ((dd.market_narrative||{}).full) || null;
  const cardId = card.card_id;
  if (!full){
    return _blk(cardId, 'debate', '&#9878;', 'Bull vs bear debate', 'Live research', '', '<div class="say">No live market-narrative research for this card yet.</div>', false);
  }
  const tab = state.debateTab[cardId] || 'bull';
  const tabs = '<div class="deb-tabs">' +
    ['bull','bear','axis','catalyst'].map(k => '<div class="dt '+k+(tab===k?' on':'')+'" data-debtab="'+escapeHTML(cardId)+'|'+k+'">'+({bull:'Bull',bear:'Bear',axis:'Contested',catalyst:'Catalysts'})[k]+'</div>').join('') +
  '</div>';
  let list = '';
  if (tab==='bull' || tab==='bear'){
    const items = full[tab+'_case'] || [];
    list = items.length ? items.map(it => '<div class="deb-item"><div class="claim">'+escapeHTML(it.claim||'')+'</div><div class="body">'+escapeHTML((it.body_md||'').slice(0,320))+(it.body_md&&it.body_md.length>320?'…':'')+'</div></div>').join('') : '<div class="say">No '+tab+' case captured.</div>';
  } else if (tab==='axis'){
    const items = full.contested_axis || [];
    list = items.length ? items.map(it => '<div class="axis-item"><div class="ax">'+escapeHTML(it.axis||'')+'</div><div class="why">'+escapeHTML((it.why_it_matters||'').slice(0,240))+'</div></div>').join('') : '<div class="say">No contested axis captured.</div>';
  } else {
    const items = full.catalysts || [];
    list = items.length ? items.map(it => '<div class="cat-item"><div class="dte">'+escapeHTML(it.date||'')+'</div><div class="ev"><b>'+escapeHTML(it.event||'')+'</b><br>'+escapeHTML((it.why_it_matters||'').slice(0,200))+'</div></div>').join('') : '<div class="say">No catalysts captured.</div>';
  }
  const regime = full.sentiment_regime && full.sentiment_regime.label;
  const badge = regime ? '<span class="blk-badge '+(regime==='optimistic'?'ok':(regime==='pessimistic'?'off':'warn'))+'">'+escapeHTML(regime)+'</span>' : '';
  return _blk(cardId, 'debate', '&#9878;', 'Bull vs bear debate', full.headline ? full.headline.slice(0,60)+'…' : 'Live research', badge, tabs+list, false);
}

/* ---- trade plan / decision discipline (SPEC E-10/E-11, D) ---- */
const STANCE_LABEL = { strong_buy:'Strong buy', accumulate:'Accumulate', hold:'Hold', trim:'Trim', avoid:'Avoid', short:'Short', maintain:'Maintain' };
function renderTradePlanBlock(card){
  const cardId = card.card_id;
  const dd = card.decode_detail || {};
  const dec = dd.decision || null;
  if (!dec || typeof dec !== 'object'){
    return _blk(cardId, 'plan', '&#9670;', 'Trade plan', 'Decision discipline', '<span class="blk-badge off">no plan</span>',
      '<div class="tp-refuse">No decision layer has run for this card yet.</div>', false);
  }
  const stance = String(dec.stance||'—');
  const kill = dec.kill || null;
  const hasKill = kill && kill.line != null && kill.line !== '';
  const sf = dec.self_falsification || (hasKill ? kill.line : null);
  if (!sf || !hasKill){
    const body = '<div class="tp-refuse">Missing an admission-of-error condition (self-falsification / KILL line) — per the honesty rule, no executable plan is emitted.' +
      (dec.rationale ? '<div class="tp-meta" style="margin-top:8px">'+escapeHTML(String(dec.rationale))+'</div>' : '') + '</div>';
    return _blk(cardId, 'plan', '&#9670;', 'Trade plan', 'Decision discipline', '<span class="blk-badge off">no plan</span>', body, false);
  }
  const conv = String(dec.conviction||'—');
  const actionable = dec.actionable !== false;
  const size = dec.size||{}, entry = dec.entry||{}, edge = dec.edge||{}, stop = dec.stop||null;
  const deg = dec.degraded===true || String(size.status||'').indexOf('degraded')===0 || String(edge.status||'').indexOf('degraded')===0;
  const scls = /accumulate|strong_buy/.test(stance)?'buy':(/trim|avoid|short/.test(stance)?'trim':'hold');
  const badge = deg ? '<span class="blk-badge warn">degraded</span>' : (actionable ? '<span class="blk-badge ok">actionable</span>' : '<span class="blk-badge warn">display only</span>');

  const strip = '<div class="tp-strip"><span class="tp-stance '+scls+'">'+escapeHTML(STANCE_LABEL[stance]||stance)+'</span>' +
    '<span class="tp-meta">conviction <b>'+escapeHTML(conv)+'</b></span>' +
    (typeof edge.edge_prob==='number' ? '<span class="tp-meta">edge <b>'+fmtPct(edge.edge_prob)+'</b></span>' : '') + '</div>';

  const entryCell = '<div class="tp-cell"><div class="k">Entry</div>' +
    (entry.price!=null ? '<div class="tp-row"><span>reference</span><span class="v">'+fmtUsd(entry.price)+'</span></div>' : '') +
    (entry.condition ? '<div class="tp-row"><span>condition</span><span class="v">'+escapeHTML(String(entry.condition))+'</span></div>' : '') + '</div>';
  const sizeCell = '<div class="tp-cell"><div class="k">Size &middot; &frac14; Kelly &middot; cap 20%</div>' +
    '<div class="tp-row"><span>target weight</span><span class="v">'+(typeof size.target_weight==='number'?fmtPct(size.target_weight):'—')+'</span></div>' +
    (size.status ? '<div class="tp-row"><span>status</span><span class="v">'+escapeHTML(String(size.status))+'</span></div>' : '') + '</div>';
  const killCell = '<div class="tp-cell kill"><div class="k">KILL &middot; '+escapeHTML(kill.status||'monitoring')+'</div>' +
    '<div class="line">'+escapeHTML(String(kill.line))+'</div>' +
    '<div class="tp-row"><span>implied prob</span><span class="v">'+(kill.implied_prob!=null?fmtPct(kill.implied_prob):'—')+'</span></div></div>';
  const stopCell = stop ? '<div class="tp-cell"><div class="k">Stop</div>' + (stop.level!=null?('<div class="tp-row"><span>trigger</span><span class="v">'+fmtUsd(stop.level)+'</span></div>'):'') + '</div>' : '';

  const sfBox = '<div class="tp-sf"><div class="k">Self-falsification</div><div class="t">'+escapeHTML(String(sf))+'</div></div>';
  const noact = !actionable ? '<div class="tp-noact">Phase-1 not executable — display only, the system never places orders.</div>' : '';
  const posSlot = '<div class="tp-pos" data-tppos="'+escapeHTML(cardId)+'">loading position context…</div>';
  const acts = '<div class="tp-acts">' +
    '<button data-poscommit="'+escapeHTML(cardId)+'|'+escapeHTML(card.subject)+'|plan_confirmed">I executed</button>' +
    '<button data-poscommit="'+escapeHTML(cardId)+'|'+escapeHTML(card.subject)+'|manual_adjust">I adjusted</button>' +
    '<button data-poscommit="'+escapeHTML(cardId)+'|'+escapeHTML(card.subject)+'|close_confirmed">I closed</button></div>';
  const rationale = dec.rationale ? '<div class="tp-meta" style="margin-top:8px">'+escapeHTML(String(dec.rationale))+'</div>' : '';

  const body = strip + posSlot + '<div class="tp-grid">'+entryCell+sizeCell+killCell+stopCell+'</div>' + sfBox + noact + acts + rationale;
  return _blk(cardId, 'plan', '&#9670;', 'Trade plan', STANCE_LABEL[stance]||stance, badge, body, false);
}

/* ---- derivation / audit trail ---- */
function renderDerivationBlock(card){
  const d = card._display || {};
  const x = d.xray || {};
  const br = x.base_rate;
  const rows = [];
  if (br && br.live){
    rows.push('<div class="der-row"><span class="k">Base-rate percentile</span><span class="v">'+br.live.percentile+'th (n='+br.live.n+')</span></div>');
    rows.push('<div class="der-row"><span class="k">Peers reaching this</span><span class="v">'+br.live.share_ge_pct+'%</span></div>');
  }
  if (x.load_bearing) rows.push('<div class="der-row"><span class="k">Load-bearing driver</span><span class="v">'+escapeHTML(x.load_bearing.label||'')+'</span></div>');
  if (typeof d.hist_cagr === 'number') rows.push('<div class="der-row"><span class="k">Historical CAGR</span><span class="v">'+fmtPct(d.hist_cagr)+'</span></div>');
  const sp = (x.scenario_probs||{}).by_name || {};
  const scenRows = Object.keys(sp).length ? '<div class="der-row"><span class="k">Scenario odds</span><span class="v">'+Object.keys(sp).map(k=>k+' '+Math.round(sp[k]*100)+'%').join(' &middot; ')+'</span></div>' : '';
  const wwh = (x.wwhtbt||[]).map(w => '<div class="wwh-item"><span class="tag'+(w.kind==='kill'?' kill':'')+'">'+escapeHTML(w.kind||'')+'</span><span>'+escapeHTML(w.label||'')+' <b>'+escapeHTML(String(w.value||''))+'</b></span></div>').join('');
  const body = (rows.join('')+scenRows) || '<div class="say">No derivation trail captured.</div>';
  return _blk(card.card_id, 'derive', '&#8776;', 'How this was derived', 'Base rates &amp; what-would-have-to-be-true', '', body + (wwh?('<div style="margin-top:10px">'+wwh+'</div>'):''), false);
}

/* ---- discuss: ask / what-if, transcript, revision proposals ---- */
function renderDiscussBlock(card){
  const cardId = card.card_id;
  const log = state.chat[cardId] || [];
  const rev = state.revision[cardId];
  const chatHtml = log.length ? '<div class="chatlog">' + log.map(m => '<div class="msg '+m.role+'">'+escapeHTML(m.text)+'</div>').join('') + '</div>' : '<div class="say">Ask a follow-up, run a what-if, or compare with another bet.</div>';
  const revHtml = rev ? ('<div class="revbox"><div class="rt">Proposed revision (not saved)</div>' +
    (rev.diff||[]).map(dd => '<div class="revrow"><span class="a">'+escapeHTML(dd.field||'')+'</span><span class="b">'+escapeHTML(String(dd.before))+' &rarr; '+escapeHTML(String(dd.after))+'</span></div>').join('') +
    '<div class="tp-acts"><button data-revsave="'+escapeHTML(cardId)+'">Save as new card</button><button data-revdrop="'+escapeHTML(cardId)+'">Discard</button></div></div>') : '';
  const body = chatHtml + revHtml + '<div class="askbar" style="margin:10px 0 0"><input type="text" data-discussinput="'+escapeHTML(cardId)+'" placeholder="Ask, compare, or say what-if…"><button class="send" data-discusssend="'+escapeHTML(cardId)+'">&uarr;</button></div>';
  return _blk(cardId, 'discuss', '&#128172;', 'Discuss', log.length?(log.length+' messages'):'Ask &middot; what-if &middot; compare', '', body, false);
}

/* ============================================================
   PORTFOLIO DETAIL — Aha-B composite hero + holdings + synthesis
   ============================================================ */
function _decodedFor(ticker){
  return state.cards.find(c => !c.derived_from && c.card_kind!=='portfolio' && String(c.subject).toUpperCase()===String(ticker).toUpperCase());
}

function renderPortfolioDetail(id){
  const pf = _lookupCard(id);
  if (!pf) return '<div class="empty">Portfolio not found.<br><button class="btn ghost" style="width:auto;margin-top:12px" data-gohome>&larr; Home</button></div>';
  const holdings = pf.holdings || [];
  const themes = [...(pf.theme_exposures||[])].sort((a,b)=>(Number(b.exposure_pct)||0)-(Number(a.exposure_pct)||0));
  const top = themes[0]||null, conc = themes.find(t=>t.is_concentration_risk)||null;

  const header = '<div class="dtop"><button class="back" data-gohome>&lsaquo;</button>' +
    '<div class="dtitle"><div class="t">' + escapeHTML(pf.subject) + '</div><div class="sub">Portfolio &middot; ' + holdings.length + ' holdings</div></div></div>';

  let headline;
  if (holdings.length < 2) headline = 'Need &ge;2 holdings for cross-holding synthesis.';
  else if (conc) headline = 'Looks like ' + holdings.length + ' names, but <b>' + Math.round(conc.exposure_pct||0) + '% of portfolio risk rides one assumption</b> — ' + escapeHTML(conc.theme) + '.';
  else if (top) headline = 'Largest exposure: ' + escapeHTML(top.theme) + ' ' + Math.round(top.exposure_pct||0) + '%.';
  else headline = 'Decode the holdings into single cards to aggregate their implied assumptions.';

  const kills = [];
  let decomp = null;
  holdings.forEach(h => {
    const c = _decodedFor(h.ticker);
    const cdd = c && c.decode_detail;
    const dec = cdd && cdd.decision;
    if (dec && dec.kill && dec.kill.line) kills.push({ tk: h.ticker, line: dec.kill.line });
    const panel = cdd && cdd.panel;
    const alt = Array.isArray(panel) ? panel.find(p => p && p.channel==='altitude') : null;
    const dd2 = alt && alt.metrics && alt.metrics.decomposition;
    if (dd2 && !decomp && (dd2.macro_pct!=null||dd2.company_pct!=null)) decomp = dd2;
  });

  const hero = '<div class="vcard"><div class="kicker">Portfolio composite &middot; Aha B</div>' +
    '<div class="ahab-headline">' + headline + '</div></div>';

  const killBody = kills.length ? kills.map(k=>'<div class="der-row"><span class="k">'+escapeHTML(k.tk)+'</span><span class="v" style="color:var(--down)">'+escapeHTML(String(k.line))+'</span></div>').join('') :
    '<div class="say">No executable KILL line on decoded holdings yet.</div>';
  const killBlk = _blk(pf.card_id, 'syskill', '&#9670;', 'Systematic KILL', 'Shared admission lines', kills.length?'<span class="blk-badge warn">'+kills.length+'</span>':'', killBody, !!kills.length);

  let concBody;
  if (decomp){
    const mp=Math.round((decomp.macro_pct||0)*100), tp=Math.round((decomp.industry_pct||0)*100), cp=Math.round((decomp.company_pct||0)*100);
    concBody = '<div class="ahab-conc-bar"><div class="seg macro" style="width:'+mp+'%">'+(mp>=12?mp+'%':'')+'</div><div class="seg theme" style="width:'+tp+'%">'+(tp>=12?tp+'%':'')+'</div><div class="seg company" style="width:'+cp+'%">'+(cp>=12?cp+'%':'')+'</div></div>' +
      '<div class="say">macro '+mp+'% &middot; theme '+tp+'% &middot; company '+cp+'%</div>';
  } else {
    concBody = '<div class="say">Altitude decomposition not available (data_missing) — not treated as diversified.</div>';
  }
  const concBlk = _blk(pf.card_id, 'concentration', '&#9673;', 'Volatility source', 'Macro / theme / company', '', concBody, false);

  const themeBars = themes.map((t,i) => {
    const pct = Number(t.exposure_pct)||0;
    return '<div style="margin:8px 0"><div class="der-row" style="border-bottom:none;padding-bottom:2px"><span class="k">'+escapeHTML(t.theme)+(t.is_concentration_risk?' <span class="blk-badge warn" style="margin-left:4px">concentration</span>':'')+'</span><span class="v">'+Math.round(pct)+'%</span></div>' +
      '<div class="alt" style="height:8px;margin:4px 0"><span style="width:'+Math.min(100,pct)+'%;background:'+(i===0?'var(--ai)':'var(--tx3)')+'"></span></div></div>';
  }).join('');
  const themeBlk = _blk(pf.card_id, 'themes', '&#9737;', 'Theme aggregation', themes.length+' themes', '', themeBars || '<div class="say">No theme data yet.</div>', false);

  const holdRows = holdings.map(h => {
    const c = _decodedFor(h.ticker);
    const st = c ? escapeHTML(oneLiner(c)) : 'not decoded yet';
    return '<div class="pf-hold-row"' + (c?(' data-gorow="'+escapeHTML(c.card_id)+'|card"'):'') + ' style="cursor:'+(c?'pointer':'default')+'">' +
      '<span class="hdot ' + (c?healthOf(c):'gray') + '"></span>' +
      '<span class="tk">' + escapeHTML(h.ticker) + '</span>' +
      '<span class="wt">' + (h.weight_pct!=null?Number(h.weight_pct).toFixed(0)+'%':'—') + '</span>' +
      '<span class="st">' + st + '</span>' +
      (c?'<span class="go">&rsaquo;</span>':'') +
    '</div>';
  }).join('');
  const holdBlk = _blk(pf.card_id, 'holdings', '&#9638;', 'Holdings', holdings.length+' positions', '', holdRows, true);

  const synthBlk = renderSynthBlock(pf);

  return header + hero + killBlk + concBlk + themeBlk + holdBlk + synthBlk;
}

function renderSynthBlock(pf){
  const holdings = pf.holdings||[];
  const ids = holdings.map(h => { const c=_decodedFor(h.ticker); return c?c.card_id:null; }).filter(Boolean);
  const key = ids.slice().sort().join('|');
  let body;
  if (ids.length < 2){
    body = '<div class="say">Decoded '+ids.length+' / '+holdings.length+' holdings — need &ge;2 decoded to compare.</div>';
  } else {
    const st = state.synth[key];
    if (!st || st==='loading') body = '<div class="say">Comparing implied assumptions across holdings…</div>';
    else if (st==='error') body = '<div class="say">Synthesis unavailable (offline / no key).</div>';
    else {
      const rels = (st.relations||[]);
      body = (st.headline_insight&&st.headline_insight.text ? ('<div class="say" style="margin-bottom:8px"><b>'+escapeHTML(st.headline_insight.text)+'</b></div>') : '') +
        (rels.length ? rels.map(r => '<div class="rel-item"><span class="rel-tag '+escapeHTML(r.type||'')+'">'+escapeHTML(r.type||'')+'</span>'+escapeHTML(r.card_a||'')+' &harr; '+escapeHTML(r.card_b||'')+'<div class="dt">'+escapeHTML(r.detail||r.shared_assumption||'')+'</div></div>').join('') : '<div class="say">No significant cross-holding relations found.</div>');
    }
  }
  return _blk(pf.card_id, 'synth', '&#8776;', 'Cross-holding synthesis', 'Shared roots, divergence, contradiction', '', body, false);
}

/* ============================================================
   DECODE FLOW + ACTIVITY STREAM
   ============================================================ */
function inferSource(input){ return String(input||'').includes(',') ? 'portfolio' : 'market'; }
function openSheet(){ document.getElementById('sheet-bg').classList.add('on'); document.getElementById('decode-sheet').classList.add('on'); document.getElementById('bet-input').focus(); }
function closeSheet(){ document.getElementById('sheet-bg').classList.remove('on'); document.getElementById('decode-sheet').classList.remove('on'); }
function _liveModeHint(){
  const v = (document.getElementById('bet-input')||{}).value||'';
  const el = document.getElementById('mode-hint');
  if (!el) return;
  el.textContent = v.trim() ? ('Will decode as &middot; ' + (inferSource(v)==='portfolio'?'portfolio':'single ticker')).replace('&middot;','·') : ' ';
}

function closeActivityStream(){ if (_activityStream){ _activityStream.close(); _activityStream=null; } }

async function runDecode(input){
  const v = String(input||'').trim();
  if (!v) return;
  closeSheet();
  const sourceType = inferSource(v);
  const sourceInput = sourceType==='portfolio' ? v.split(',').map(s=>s.trim()).filter(Boolean).map(t=>({ticker:t})) : v.toUpperCase();
  const jobId = 'job_' + Math.random().toString(36).slice(2,10);
  showToast('Decoding ' + escapeHTML(v) + '…');
  closeActivityStream();
  let n = 0;
  try {
    _activityStream = new EventSource('/api/stream/activity/' + encodeURIComponent(jobId));
    _activityStream.addEventListener('activity', () => { n++; showToast('Decoding ' + escapeHTML(v) + '… (' + n + ' steps)'); });
    _activityStream.addEventListener('done', () => closeActivityStream());
    _activityStream.onerror = () => closeActivityStream();
  } catch(_) {}
  const r = await api.decode(sourceType, sourceInput, jobId);
  closeActivityStream();
  if (!r.ok){
    showToast('Decode failed: ' + escapeHTML((r.body&&r.body.message)||('HTTP '+r.status)));
    return;
  }
  const card = r.body.card;
  state.cards = state.cards.filter(c => c.card_id !== card.card_id).concat([card]);
  state.detail[card.card_id] = card;
  showToast('Decoded ' + escapeHTML(card.subject));
  nav(card.card_kind==='portfolio'?'portfolio':'card', card.card_id);
}

async function ensureCardDetail(id){
  if (state.detail[id]) return;
  const r = await api.card(id);
  if (r.ok) state.detail[id] = r.body;
  if (state.view==='card' && state.activeId===id) render();
  else if (state.view==='portfolio' && state.activeId===id) render();
}

async function askCard(cardId, question){
  state.chat[cardId] = state.chat[cardId] || [];
  state.chat[cardId].push({ role:'you', text:question });
  state.openBlk[cardId] = 'discuss';
  render();
  const jobId = 'ask_' + Math.random().toString(36).slice(2,10);
  const r = await api.ask(cardId, question, jobId);
  if (!r.ok){
    state.chat[cardId].push({ role:'agent', text: 'Could not answer (offline / no key).' });
  } else {
    if (r.body.answer) state.chat[cardId].push({ role:'agent', text: String(r.body.answer) });
    if (r.body.revision) state.revision[cardId] = r.body.revision;
  }
  render();
}

async function saveRevision(cardId){
  const rev = state.revision[cardId];
  if (!rev) return;
  const r = await api.revise(cardId, rev);
  if (r.ok && r.body.card){
    const nc = r.body.card;
    state.cards.push(nc);
    state.detail[nc.card_id] = nc;
    delete state.revision[cardId];
    showToast('Saved as a new derived card.');
    nav('card', nc.card_id);
  } else {
    showToast('Could not save revision.');
  }
}
function dropRevision(cardId){ delete state.revision[cardId]; render(); }

async function ensureTradePlanContext(cardId, subject){
  const slot = document.querySelector('[data-tppos="'+cssAttr(cardId)+'"]');
  if (!slot) return;
  try {
    const r = await api.plan(cardId, {});
    const pc = (r.body && r.body.position_context) || {};
    let cls='', txt;
    if (!pc.has_position) txt = 'The system does not know whether you hold ' + escapeHTML(subject) + ' — confirm below.';
    else if (pc.position_freshness==='stale_snapshot'){ cls=' stale'; txt='This is an import snapshot, not a confirmed holding.'; }
    else if (pc.position_source==='user_preview'){ cls=' preview'; txt='Preview position — observation only.'; }
    else { const w = pc.latest_event&&pc.latest_event.weight_pct!=null?(' · '+pc.latest_event.weight_pct+'%'):''; txt='Confirmed holding'+w+' — KILL monitoring active.'; }
    slot.className='tp-pos'+cls; slot.innerHTML=txt;
  } catch(_) { slot.textContent='position context unavailable.'; }
}

async function confirmPosition(cardId, subject, kind){
  const body = { subject, source:kind, executed_at:new Date().toISOString(), plan_card_id:cardId };
  if (kind==='close_confirmed'){ body.side='flat'; body.weight_pct=0; }
  else {
    const w = prompt('Position weight % (0–100):','5');
    if (w==null) return;
    const wp = Number(w);
    if (!isFinite(wp)||wp<0||wp>100){ showToast('Weight must be 0–100'); return; }
    body.side='long'; body.weight_pct=wp;
  }
  const r = await api.positionEvent(body);
  if (!r.ok){ showToast('Record failed.'); return; }
  showToast('Position recorded · ' + escapeHTML(subject));
  state.positions = null;
  await ensurePositions();
  ensureTradePlanContext(cardId, subject);
}

async function ensurePositions(){
  if (state.positions) return;
  const r = await api.positions('open');
  state.positions = r.ok ? (r.body.positions||[]) : [];
}

async function ensureSynth(pf){
  const ids = (pf.holdings||[]).map(h=>{const c=_decodedFor(h.ticker);return c?c.card_id:null;}).filter(Boolean);
  if (ids.length<2) return;
  const key = ids.slice().sort().join('|');
  if (state.synth[key]) return;
  state.synth[key]='loading';
  try {
    const r = await api.synthesize(ids);
    state.synth[key] = r.ok ? r.body : 'error';
  } catch(_) { state.synth[key]='error'; }
  if (state.view==='portfolio' && state.activeId===pf.card_id) render();
}

/* ============================================================
   CHANGES DRAWER (SPEC E-14..E-17, W3)
   ============================================================ */
const SEV_LABEL = { high:'HIGH', medium:'MED', low:'LOW', unknown:'UNKNOWN' };
function openChanges(){ document.getElementById('changes-panel').classList.add('open'); renderChangesFeed(); }
function closeChanges(){ document.getElementById('changes-panel').classList.remove('open'); }

async function renderChangesFeed(){
  const list = document.getElementById('chg-list');
  if (!list) return;
  list.innerHTML = '<div class="empty" style="padding:24px 10px">loading…</div>';
  try {
    const r = await api.monitorFeed();
    const items = r.ok ? (r.body.items||[]) : [];
    const btn = document.getElementById('changes-btn');
    if (btn) btn.classList.toggle('has', items.some(it=>it.severity==='high'||it.severity==='medium'));
    if (!items.length){
      list.innerHTML = '<div class="empty" style="padding:24px 10px">No changes recorded yet. Hit Scan to check confirmed positions + watchlist. Unscanned subjects are never reported as calm.</div>';
      return;
    }
    list.innerHTML = items.map(it => {
      const sev = String(it.severity||'unknown');
      const why = Array.isArray(it.why_severity) ? it.why_severity : [];
      return '<div class="chg-item sev-'+sev+'" data-chgsubj="'+escapeHTML(it.subject||'')+'">' +
        '<div class="top"><span class="subj">'+escapeHTML(it.subject||'?')+'</span><span class="sev">'+escapeHTML(SEV_LABEL[sev]||sev)+'</span></div>' +
        '<div class="headline">'+escapeHTML(it.headline||it.trigger||'')+'</div>' +
        (why.length ? '<div class="why">'+why.map(escapeHTML).join(' &middot; ')+'</div>' : (sev==='unknown'?'<div class="why">unscanned — not reported as calm</div>':'')) +
      '</div>';
    }).join('');
    list.querySelectorAll('[data-chgsubj]').forEach(el => el.addEventListener('click', () => {
      const subj = el.getAttribute('data-chgsubj');
      const card = _decodedFor(subj) || state.cards.find(c=>String(c.subject).toUpperCase()===String(subj).toUpperCase());
      if (card){ closeChanges(); nav(card.card_kind==='portfolio'?'portfolio':'card', card.card_id); }
      else showToast('No card for '+escapeHTML(subj)+' — decode it first.');
    }));
  } catch(_) { list.innerHTML = '<div class="empty" style="padding:24px 10px">Monitor feed unavailable (offline).</div>'; }
}

async function runMonitorScan(){
  const btn = document.getElementById('chg-scan');
  if (btn){ btn.disabled=true; btn.textContent='scanning…'; }
  try {
    const r = await api.monitorScan([]);
    showToast(r.ok ? ('Scan '+escapeHTML(String((r.body&&r.body.status)||'ok'))) : 'Scan failed.');
  } catch(_) { showToast('Scan failed (offline).'); }
  if (btn){ btn.disabled=false; btn.textContent='Scan'; }
  renderChangesFeed();
}

/* ============================================================
   EVENT BINDING + SIDE EFFECTS
   ============================================================ */
function bindViewEvents(){
  const root = document.getElementById('view');
  root.querySelectorAll('[data-gorow]').forEach(el => el.addEventListener('click', () => {
    const [id, kind] = el.getAttribute('data-gorow').split('|');
    nav(kind==='portfolio'?'portfolio':'card', id);
  }));
  root.querySelectorAll('[data-gohome]').forEach(el => el.addEventListener('click', () => nav('home')));
  root.querySelectorAll('[data-hometab]').forEach(el => el.addEventListener('click', () => { state.homeTab = el.getAttribute('data-hometab'); render(); }));
  root.querySelectorAll('[data-blktoggle]').forEach(el => el.addEventListener('click', () => {
    const [cardId, key] = el.getAttribute('data-blktoggle').split('|');
    const cur = state.openBlk[cardId];
    state.openBlk[cardId] = (cur===key) ? null : key;
    render();
  }));
  root.querySelectorAll('[data-debtab]').forEach(el => el.addEventListener('click', () => {
    const [cardId, key] = el.getAttribute('data-debtab').split('|');
    state.debateTab[cardId] = key;
    render();
  }));
  root.querySelectorAll('[data-poscommit]').forEach(el => el.addEventListener('click', () => {
    const [cardId, subject, kind] = el.getAttribute('data-poscommit').split('|');
    confirmPosition(cardId, subject, kind);
  }));
  root.querySelectorAll('[data-revsave]').forEach(el => el.addEventListener('click', () => saveRevision(el.getAttribute('data-revsave'))));
  root.querySelectorAll('[data-revdrop]').forEach(el => el.addEventListener('click', () => dropRevision(el.getAttribute('data-revdrop'))));
  root.querySelectorAll('[data-discusssend]').forEach(el => el.addEventListener('click', () => {
    const cardId = el.getAttribute('data-discusssend');
    const inp = root.querySelector('[data-discussinput="'+cssAttr(cardId)+'"]');
    const q = (inp.value||'').trim(); if (!q) return; inp.value=''; askCard(cardId, q);
  }));
  root.querySelectorAll('[data-discussinput]').forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key!=='Enter') return;
    const cardId = inp.getAttribute('data-discussinput');
    const q = (inp.value||'').trim(); if (!q) return; inp.value=''; askCard(cardId, q);
  }));
  const emptyDecode = document.getElementById('empty-decode');
  if (emptyDecode) emptyDecode.addEventListener('click', openSheet);
}

function afterRenderSideEffects(){
  if (state.view==='card'){
    const card = _lookupCard(state.activeId);
    if (!card) return;
    if (!state.detail[state.activeId]) { ensureCardDetail(state.activeId); return; }
    paintChart(card);
    bindAskBar(card);
    ensureTradePlanContext(card.card_id, card.subject);
  } else if (state.view==='portfolio'){
    const pf = _lookupCard(state.activeId);
    if (!pf) return;
    if (!state.detail[state.activeId]) { ensureCardDetail(state.activeId); return; }
    ensureSynth(pf);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
async function initOffline(){
  try {
    const r = await api.offlineMode();
    state.offline = !!(r.ok && r.body.offline);
  } catch(_) {}
  const pill = document.getElementById('offline-pill');
  if (pill){ pill.textContent = state.offline?'Offline':'Live'; pill.classList.toggle('on', state.offline); }
}

async function loadExistingCards(){
  try {
    const r = await api.cards();
    if (r.ok && Array.isArray(r.body.cards)) state.cards = r.body.cards;
  } catch(_) {}
  await ensurePositions();
  routeFromHash();
}

document.getElementById('fab-decode').addEventListener('click', openSheet);
document.getElementById('sheet-bg').addEventListener('click', closeSheet);
document.getElementById('decode-go').addEventListener('click', () => runDecode(document.getElementById('bet-input').value));
document.getElementById('bet-input').addEventListener('keydown', e => { if (e.key==='Enter') runDecode(e.target.value); });
document.getElementById('bet-input').addEventListener('input', _liveModeHint);
document.querySelectorAll('#decode-sheet .chip').forEach(b => b.addEventListener('click', () => {
  const v = b.getAttribute('data-input');
  document.getElementById('bet-input').value = v; _liveModeHint();
  runDecode(v);
}));
document.getElementById('changes-btn').addEventListener('click', openChanges);
document.getElementById('chg-close').addEventListener('click', closeChanges);
document.getElementById('chg-scan').addEventListener('click', runMonitorScan);

initOffline();
loadExistingCards();






</script>
