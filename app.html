<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayInsight - Investment-bet X-ray</title>
<style>
:root{
  --paper:#0B0E11; --card:#161A1F; --card2:#1C222A; --line:#252C35; --line2:#1a1f26;
  --ink:#EAECEF; --ink2:#C7CDD6; --tx2:#8A94A3; --tx3:#5B6673; --tx4:#454E58;
  --up:#16C784; --down:#F6465D; --amber:#F0B90B; --ai:#7B61FF; --ai-soft:rgba(123,97,255,.13);
  --teal:#5DCAA5; --r:18px; --r-sm:12px;
  --sans:"Inter","Geist",-apple-system,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:90px}
.num,.mono{font-family:var(--mono);font-feature-settings:"tnum" 1,"zero" 1}
button{font-family:var(--sans);cursor:pointer}
a{color:inherit}
::selection{background:var(--ink);color:var(--paper)}

/* ============ layout shell ============ */
.app{max-width:640px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:40;background:rgba(11,14,17,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.01em}
.brand .mk{width:20px;height:20px;border-radius:6px;background:var(--ai);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--tx3);background:var(--card)}
.pill.on{color:var(--amber);border-color:rgba(240,185,11,.3);background:rgba(240,185,11,.08)}
.iconbtn{position:relative;width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:14px}
.iconbtn .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--down);display:none}
.iconbtn.has .dot{display:block}

/* ============ home: hero + segmented + list ============ */
.folio{margin:14px 0 4px;padding:16px 16px 14px;background:var(--card);border-radius:var(--r);}
.folio .lbl{font-size:11px;color:var(--tx2);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.folio .big{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:6px 0 8px}
.folio .kicker{font-size:12.5px;color:var(--ink2);line-height:1.5}
.folio .kicker b{color:var(--amber);font-weight:700}

.seg{display:flex;gap:6px;margin:14px 0 10px;padding:3px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.seg .s{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--tx3);padding:8px 10px;border-radius:9px;transition:all .15s}
.seg .s.on{color:var(--ink);background:var(--card2)}

.empty{text-align:center;padding:60px 20px;color:var(--tx3);font-size:13px;line-height:1.7}
.empty .big-ico{font-size:32px;margin-bottom:12px;opacity:.5}
.empty button{margin-top:16px}

/* position-terminal row */
.prow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border-radius:var(--r);margin-bottom:8px;border:1px solid transparent;transition:border-color .15s}
.prow:hover{border-color:var(--line)}
.hdot{width:8px;height:8px;border-radius:50%;flex:none}
.hdot.red{background:var(--down);box-shadow:0 0 0 3px rgba(246,70,93,.15)}
.hdot.yellow{background:var(--amber);box-shadow:0 0 0 3px rgba(240,185,11,.15)}
.hdot.green{background:var(--up);box-shadow:0 0 0 3px rgba(22,199,132,.15)}
.hdot.gray{background:var(--tx4)}
.plogo{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink2);flex:none}
.pmid{flex:1;min-width:0}
.pmid .t1{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.pmid .t1 .tag{font-size:9px;font-weight:600;color:var(--tx3);background:var(--card2);padding:1px 6px;border-radius:5px;text-transform:uppercase}
.pmid .t2{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pright{text-align:right;flex:none}
.pright .px{font-size:14px;font-weight:700}
.pright .chg{font-size:11px;font-weight:600;margin-top:2px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--tx3)}
.pcaret{color:var(--tx4);font-size:14px;flex:none}

/* ============ FAB + decode sheet ============ */
.fab{position:fixed;bottom:24px;right:calc(50% - 320px + 20px);width:52px;height:52px;border-radius:50%;background:var(--ai);color:#fff;border:none;font-size:24px;font-weight:400;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(123,97,255,.4);z-index:45}
@media (max-width:680px){.fab{right:20px}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:640px;background:var(--paper-2,var(--card));border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 18px 22px;z-index:51;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet .hd{font-size:15px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-size:12px;color:var(--tx2);margin-bottom:14px}
.sheet input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font-size:14px;font-family:var(--sans);outline:none}
.sheet input[type=text]:focus{border-color:var(--ai)}
.sheet .modehint{font-size:11px;color:var(--tx3);margin:8px 2px 14px}
.sheet .presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--tx2)}
.chip:hover{border-color:var(--ai);color:var(--ink)}
.btn{border:none;border-radius:12px;padding:13px 18px;font-size:13.5px;font-weight:700;width:100%}
.btn.primary{background:var(--ai);color:#fff}
.btn.primary:disabled{opacity:.5}
.btn.ghost{background:var(--card2);color:var(--ink2);border:1px solid var(--line)}

/* ============ detail: hero ============ */
.dtop{display:flex;align-items:center;gap:10px;padding:14px 0 6px;position:sticky;top:53px;background:rgba(11,14,17,.92);backdrop-filter:blur(10px);z-index:30}
.back{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:16px;flex:none}
.dtitle{flex:1;min-width:0}
.dtitle .t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.dtitle .sub{font-size:11.5px;color:var(--tx2);margin-top:1px}
.dpx{text-align:right;flex:none}
.dpx .p{font-size:16px;font-weight:700}
.dpx .d{font-size:11.5px;font-weight:600;margin-top:1px}

.vcard{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0}
.vcard .kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.vcard .headline{font-size:15.5px;font-weight:700;line-height:1.4}
.vcard .say{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:6px}

/* ============ chart-as-subject ============ */
.chartcard{background:var(--card);border-radius:var(--r);margin:10px 0;padding:14px 6px 4px;position:relative}
.chartcard .chd{display:flex;justify-content:space-between;align-items:center;padding:0 10px 8px;font-size:11px;color:var(--tx3)}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:0 10px 8px}
.legend .li{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--tx2)}
.legend .sw{width:12px;height:3px;border-radius:2px;flex:none}
.legend .sw.dist{background:var(--teal);opacity:.5;height:7px}
.legend .sw.imp{background:var(--ai)}
.legend .sw.cons{border-top:1px dashed var(--tx2);height:0}
.legend .sw.evt{background:var(--amber);width:2px;height:9px}
.legend .sw.kill{border-top:1px dashed var(--down);height:0}
#chartSvg{width:100%;display:block;overflow:visible;touch-action:pan-y}
.hit{cursor:pointer}
.hit:hover{opacity:.85}
.active-el{filter:brightness(1.35)}
.snap-note{font-size:10px;color:var(--tx4);text-align:center;padding:6px 10px 2px}

.ai-strip{margin:8px 10px;background:var(--ai-soft);border:1px solid rgba(123,97,255,.3);border-radius:14px;padding:13px 14px;display:flex;gap:11px;min-height:64px;transition:border-color .2s}
.ai-strip .ico{width:26px;height:26px;border-radius:8px;background:var(--ai);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none;margin-top:1px}
.ai-strip .body{flex:1;min-width:0}
.ai-strip .txt{font-size:13px;color:#E7E4FA;line-height:1.55}
.ai-strip .txt b{color:#fff;font-weight:700}
.ai-strip .src{font-size:9.5px;color:var(--ai);margin-top:6px;display:block;font-weight:600}

.askbar{margin:0 10px 10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:flex;align-items:center;gap:9px}
.askbar input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:13px;font-family:var(--sans)}
.askbar input::placeholder{color:var(--tx3)}
.askbar .send{width:28px;height:28px;border-radius:9px;background:var(--ai);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.askbar .send:disabled{opacity:.4}

/* ============ accordion blocks ============ */
.blk{background:var(--card);border-radius:var(--r);margin:8px 0;overflow:hidden;border:1px solid transparent;transition:border-color .15s}
.blk.open{border-color:var(--line)}
.blk-head{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer}
.blk-head .ico{width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.blk-head .tt{flex:1;min-width:0}
.blk-head .tt .t{font-size:13px;font-weight:700}
.blk-head .tt .s{font-size:11px;color:var(--tx2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk-head .car{color:var(--tx3);font-size:12px;transition:transform .18s;flex:none}
.blk.open .blk-head .car{transform:rotate(90deg)}
.blk-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;flex:none}
.blk-badge.ok{background:rgba(22,199,132,.14);color:var(--up)}
.blk-badge.warn{background:rgba(240,185,11,.16);color:var(--amber)}
.blk-badge.off{background:rgba(246,70,93,.14);color:var(--down)}
.blk-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.blk.open .blk-body{max-height:3000px}
.blk-body-in{padding:0 15px 16px}

/* odds / distribution block */
.odds{display:flex;align-items:center;gap:14px}
.odds .big{font-size:28px;font-weight:800;letter-spacing:-.6px}
.odds .r{flex:1;min-width:0}
.odds .r .rg{font-size:13px;font-weight:600}
.odds .r .tl{font-size:11px;color:var(--tx2);margin-top:2px}
.bandviz{margin-top:10px}

/* altitude bar */
.alt{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 10px}
.alt span{display:block;height:100%}
.altleg{display:flex;flex-wrap:wrap;gap:12px}
.altleg .l{font-size:11.5px;color:var(--tx2);font-weight:500}
.altleg .l i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}

/* debate block */
.deb-tabs{display:flex;gap:6px;margin-bottom:10px}
.deb-tabs .dt{font-size:11px;font-weight:700;padding:5px 11px;border-radius:8px;color:var(--tx3);background:var(--card2)}
.deb-tabs .dt.on{color:var(--ink)}
.deb-tabs .dt.bull.on{color:var(--up);background:rgba(22,199,132,.12)}
.deb-tabs .dt.bear.on{color:var(--down);background:rgba(246,70,93,.12)}
.deb-item{padding:10px 0;border-bottom:1px solid var(--line2)}
.deb-item:last-child{border-bottom:none}
.deb-item .claim{font-size:12.5px;font-weight:700;color:var(--ink)}
.deb-item .body{font-size:12px;color:var(--tx2);line-height:1.6;margin-top:4px}
.axis-item{padding:9px 0;border-bottom:1px solid var(--line2)}
.axis-item:last-child{border-bottom:none}
.axis-item .ax{font-size:12.5px;font-weight:700;color:var(--amber)}
.axis-item .why{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.5}
.cat-item{display:flex;gap:10px;padding:8px 0}
.cat-item .dte{font-size:10.5px;color:var(--tx3);font-family:var(--mono);flex:none;width:64px}
.cat-item .ev{font-size:12px;color:var(--ink2)}

/* trade plan */
.tp-strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.tp-stance{font-family:var(--mono);font-size:17px;font-weight:700}
.tp-stance.buy{color:var(--up)} .tp-stance.hold{color:var(--ink2)} .tp-stance.trim{color:var(--down)}
.tp-meta{font-size:11px;color:var(--tx2)}
.tp-meta b{color:var(--ink);font-family:var(--mono)}
.tp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.tp-cell{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:var(--card2)}
.tp-cell .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:5px}
.tp-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:1.5px 0}
.tp-row .v{font-family:var(--mono);color:var(--ink)}
.tp-cell.kill{border-left:3px solid var(--down)}
.tp-cell.kill .line{font-family:var(--mono);color:var(--down);font-size:12px;margin-bottom:3px}
.tp-sf{margin-top:10px;border:1px dashed var(--amber);border-radius:10px;padding:9px 11px;background:rgba(240,185,11,.06)}
.tp-sf .k{color:var(--amber);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}
.tp-sf .t{font-family:var(--mono);color:var(--ink);font-size:11.5px;margin-top:4px}
.tp-pos{margin-top:10px;font-size:11px;padding:8px 10px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);color:var(--ink2)}
.tp-pos.stale{background:rgba(240,185,11,.08);border-color:var(--amber);color:var(--amber)}
.tp-pos.preview{background:var(--ai-soft);border-color:var(--ai)}
.tp-acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tp-acts button{font-size:11px;padding:7px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--card2);color:var(--ink2)}
.tp-acts button:hover{border-color:var(--ai);color:var(--ink)}
.tp-refuse{padding:11px;border:1px dashed var(--down);border-radius:10px;color:var(--down);font-size:12px;background:rgba(246,70,93,.05)}
.tp-noact{color:var(--amber);font-size:10.5px;margin-top:7px}

/* derivation / audit */
.der-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line2)}
.der-row:last-child{border-bottom:none}
.der-row .k{color:var(--tx2)}
.der-row .v{color:var(--ink);font-family:var(--mono);text-align:right}
.wwh-item{display:flex;gap:8px;padding:6px 0;font-size:11.5px;color:var(--ink2)}
.wwh-item .tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--card2);color:var(--tx2);flex:none;text-transform:uppercase;height:fit-content}
.wwh-item .tag.kill{background:rgba(246,70,93,.14);color:var(--down)}

/* discuss */
.chatlog{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.msg{font-size:12.5px;line-height:1.55}
.msg.you{color:var(--ink2);font-weight:600}
.msg.you::before{content:"You · ";color:var(--tx3);font-weight:400}
.msg.agent{color:var(--ink2)}
.msg.agent::before{content:"Agent · ";color:var(--ai);font-weight:600}
.revbox{border:1px dashed var(--ai);border-radius:10px;padding:10px 12px;margin-top:6px;background:var(--ai-soft)}
.revbox .rt{font-size:11px;font-weight:700;color:var(--ai);margin-bottom:6px}
.revrow{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0}
.revrow .a{color:var(--tx2)} .revrow .b{color:var(--ink);font-family:var(--mono)}

/* portfolio Aha-B */
.ahab-headline{font-size:15px;line-height:1.5}
.ahab-headline b{color:var(--amber)}
.ahab-conc-bar{display:flex;height:20px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.ahab-conc-bar .seg{display:flex;align-items:center;justify-content:center;font-size:9px;color:#05070A;font-weight:700}
.ahab-conc-bar .macro{background:var(--tx2)} .ahab-conc-bar .theme{background:var(--teal)} .ahab-conc-bar .company{background:var(--ai)}
.pf-hold-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.pf-hold-row:last-child{border-bottom:none}
.pf-hold-row .tk{font-size:12.5px;font-weight:700;width:56px;flex:none}
.pf-hold-row .wt{font-size:11px;color:var(--tx2);width:44px;flex:none}
.pf-hold-row .st{flex:1;font-size:11.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-hold-row .go{color:var(--tx4);font-size:12px}
.rel-item{padding:9px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.rel-item:last-child{border-bottom:none}
.rel-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;margin-right:6px}
.rel-tag.contradiction{background:rgba(246,70,93,.14);color:var(--down)}
.rel-tag.divergence{background:rgba(240,185,11,.14);color:var(--amber)}
.rel-tag.consensus,.rel-tag.same-source{background:rgba(22,199,132,.12);color:var(--up)}
.rel-tag.drift{background:var(--card2);color:var(--tx2)}
.rel-item .dt{color:var(--ink2);margin-top:4px}

/* ============ changes drawer ============ */
.drawer{position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .22s ease;z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .hd .ttl{font-size:13px;font-weight:700}
.drawer .hd .cls{margin-left:auto;background:transparent;border:none;color:var(--tx2);font-size:18px}
.drawer .hd .scan{background:var(--ai);color:#fff;border:none;font-size:11px;padding:5px 10px;border-radius:7px}
.drawer .list{overflow-y:auto;padding:10px 14px;flex:1}
.chg-item{border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:10px 12px;margin-bottom:9px;cursor:pointer;background:var(--card2)}
.chg-item.sev-high{border-left-color:var(--down)}
.chg-item.sev-medium{border-left-color:var(--amber)}
.chg-item.sev-low{border-left-color:var(--tx3)}
.chg-item.sev-unknown{border-left-color:var(--tx2);border-left-style:dashed}
.chg-item .top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.chg-item .subj{font-family:var(--mono);font-weight:700}
.chg-item .sev{font-size:9px;text-transform:uppercase}
.chg-item .headline{font-size:11.5px;color:var(--ink2);margin:5px 0}
.chg-item .why{font-size:10px;color:var(--tx2)}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
